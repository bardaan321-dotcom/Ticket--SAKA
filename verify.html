<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | Just BLR Arena</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface: #111111;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-primary: #8a2be2;
            --accent-secondary: #ff2a5f;
            --success: #2ed573;
            --warning: #ffa502;
            --danger: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% -20%, #2a1140 0%, #050505 60%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(255, 42, 95, 0.2);
            color: var(--accent-secondary);
            border: 1px solid var(--accent-secondary);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
        }

        /* Scanner Box */
        .scanner-box {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(138, 43, 226, 0.1);
        }

        button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Result States */
        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card.valid {
            display: block;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid var(--success);
        }

        .result-card.scanned {
            display: block;
            background: rgba(255, 165, 2, 0.1);
            border: 1px solid var(--warning);
        }

        .result-card.invalid {
            display: block;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--danger);
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .status-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .valid .status-title {
            color: var(--success);
        }

        .scanned .status-title {
            color: var(--warning);
        }

        .invalid .status-title {
            color: var(--danger);
        }

        .ticket-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: none;
        }

        .valid .ticket-details,
        .scanned .ticket-details {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            color: white;
            font-weight: 600;
        }

        .highlight-count {
            color: var(--success);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
        }

        .footer-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-link a:hover {
            color: white;
        }

        /* Admin Dashboard Styles */
        .admin-dashboard {
            margin-top: 3rem;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .admin-dashboard h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .pending-list {
            margin-top: 1rem;
        }

        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }

        .item-info strong {
            display: block;
            color: white;
            margin-bottom: 0.3rem;
        }

        .item-info span {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-approve,
        .btn-reject {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-approve {
            background: rgba(46, 213, 115, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .btn-approve:hover {
            background: var(--success);
            color: white;
        }

        .btn-reject {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-reject:hover {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem 0;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="badge">Staff Portal</div>
            <h1>Entry Verification</h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Saka Live Concert</p>
        </div>

        <div class="scanner-box">
            <form id="verify-form">
                <div class="input-group">
                    <input type="text" id="ticket-code" placeholder="ENTER CODE" required autocomplete="off">
                </div>
                <button type="submit">Verify Entrance</button>
            </form>

            <div id="result-container">
                <!-- States injected via JS -->
            </div>
        </div>

        <div class="footer-link">
            <a href="index.html">← Back to Main Site</a>
        </div>
    </div>

    <script src="verify.js"></script>
</body>

</html>
